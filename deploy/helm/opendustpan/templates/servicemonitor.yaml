{{- if .Values.metrics.serviceMonitor.enabled }}
{{- with .Values.metrics.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "opendustpan.fullname" $ }}
  labels:
    {{- include "opendustpan.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "opendustpan.selectorLabels" $ | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      scheme: {{ lower (include "opendustpan.scheme" $) }}
      interval: {{ .interval }}
      scrapeTimeout: {{ .scrapeTimeout }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .tokenSecret.name }}
          key: {{ .tokenSecret.key }}
{{- end }}
{{- end }}
