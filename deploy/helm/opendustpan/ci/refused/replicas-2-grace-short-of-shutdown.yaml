# Refused: a grace period below the preStop wait + 10 s of drain + 30 s of server shutdown.
# want: must be at least preStopSeconds (15) + 40
database:
  existingSecret:
    name: opendustpan-database
keyEncryptionKey:
  existingSecret:
    name: opendustpan-key-encryption-key
replicas: 2
terminationGracePeriodSeconds: 40
blobStore:
  type: s3
  s3:
    bucket: dustpan-state
