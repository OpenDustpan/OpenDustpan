# Refused: several replicas with a file: audit sink.
# want: server.extraEnv DUSTPAN_AUDIT_SINK has a file: sink
database:
  existingSecret:
    name: opendustpan-database
keyEncryptionKey:
  existingSecret:
    name: opendustpan-key-encryption-key
replicas: 2
blobStore:
  type: s3
  s3:
    bucket: dustpan-state
server:
  extraEnv:
    - name: DUSTPAN_AUDIT_SINK
      value: siem=file:/var/log/audit.log
