# The smallest install: one instance, blobs on a PersistentVolumeClaim.
database:
  existingSecret:
    name: opendustpan-database
keyEncryptionKey:
  existingSecret:
    name: opendustpan-key-encryption-key
adminToken:
  existingSecret:
    name: opendustpan-admin-token
# An ingress or a load balancer in front ends TLS.
server:
  publicURL: https://dustpan.example
