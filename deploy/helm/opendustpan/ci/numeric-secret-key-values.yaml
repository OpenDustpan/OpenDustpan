# Secret names and keys that YAML reads as a number or a boolean when they
# are not quoted. Each one must render as a string, or kubeconform refuses it.
database:
  existingSecret:
    name: "123"
    key: "true"
keyEncryptionKey:
  existingSecret:
    name: "456"
    key: "false"
adminToken:
  existingSecret:
    name: "789"
    key: "1e3"
s3:
  endpoint: https://s3.example
  region: eu-west-1
  credentials:
    existingSecret:
      name: "321"
      accessKeyIDKey: "123"
      secretAccessKeyKey: "true"
blobStore:
  type: s3
  s3:
    bucket: dustpan-state
backup:
  target:
    type: s3
    s3:
      bucket: dustpan-backups
  schedule:
    enabled: true
    tokenSecret:
      name: "654"
      key: "null"
    caSecret:
      name: "987"
      key: "12"
server:
  tls:
    existingSecret: "111"
metrics:
  serviceMonitor:
    enabled: true
    tokenSecret:
      name: "222"
      key: "no"
    tlsConfig:
      caSecret:
        name: "333"
        key: "0"
networkPolicy:
  allowAllEgress: true
