# One instance: built-in TLS, blobs and backups on claims, a console
# configuration and a bootstrap admin token.
database:
  existingSecret:
    name: opendustpan-database
    key: url
keyEncryptionKey:
  existingSecret:
    name: opendustpan-key-encryption-key
adminToken:
  existingSecret:
    name: opendustpan-admin-token
blobStore:
  type: fs
  fs:
    persistence:
      existingClaim: opendustpan-existing-blobs
backup:
  target:
    type: dir
    dir:
      persistence:
        storageClassName: fast
        size: 50Gi
  schedule:
    enabled: true
    tokenSecret:
      name: opendustpan-backup-token
console:
  runtimeConfig:
    apiBase: https://dustpan.example
server:
  tls:
    existingSecret: opendustpan-tls
networkPolicy:
  allowAllEgress: true
