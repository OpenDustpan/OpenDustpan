apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: release-opendustpan
  namespace: dustpan
  labels:
    helm.sh/chart: opendustpan-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: opendustpan
    app.kubernetes.io/name: opendustpan
    app.kubernetes.io/instance: release
    app.kubernetes.io/component: server
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - dustpan.example
      secretName: dustpan-example-tls
  rules:
    - host: "dustpan.example"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: release-opendustpan
                port:
                  number: 80
