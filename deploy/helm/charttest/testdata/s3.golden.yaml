kind: ServiceMonitor
metadata:
  name: release-opendustpan
  namespace: dustpan
  labels:
    helm.sh/chart: opendustpan-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
