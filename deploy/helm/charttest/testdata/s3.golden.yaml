apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: release-opendustpan
  namespace: dustpan
  labels:
    helm.sh/chart: opendustpan-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: opendustpan
    app.kubernetes.io/name: opendustpan
    app.kubernetes.io/instance: release
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opendustpan
      app.kubernetes.io/instance: release
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opendustpan
              app.kubernetes.io/instance: release
              app.kubernetes.io/component: backup
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
    - ports:
      - port: 80
        protocol: TCP
      to:
      - ipBlock:
          cidr: 169.254.169.254/32
