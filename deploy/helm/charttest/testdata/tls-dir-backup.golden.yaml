# Source: opendustpan/templates/cronjob-backup.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: release-opendustpan-backup
  labels:
    helm.sh/chart: opendustpan-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: opendustpan
    app.kubernetes.io/name: opendustpan
    app.kubernetes.io/instance: release
    app.kubernetes.io/component: backup
spec:
  schedule: "17 2 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: opendustpan
            app.kubernetes.io/instance: release
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          serviceAccountName: release-opendustpan-backup
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: "ghcr.io/opendustpan/opendustpan:0.1.0"
              imagePullPolicy: IfNotPresent
              args:
                - backup
                - "--server=https://release-opendustpan.dustpan.svc:443"
                - "--ca-file=/ca/ca.crt"
              env:
                - name: DUSTPAN_ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: opendustpan-backup-token
                      key: token
              resources:
                limits:
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                privileged: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: ca
                  mountPath: /ca
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: ca
              secret:
                secretName: opendustpan-ca
                items:
                  - key: "ca.crt"
                    path: "ca.crt"
