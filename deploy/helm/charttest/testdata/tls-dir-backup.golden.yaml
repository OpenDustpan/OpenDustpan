apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: release-opendustpan
  labels:
    helm.sh/chart: opendustpan-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: opendustpan
    app.kubernetes.io/name: opendustpan
    app.kubernetes.io/instance: release
    app.kubernetes.io/component: server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opendustpan
      app.kubernetes.io/instance: release
      app.kubernetes.io/component: server
  namespaceSelector:
    matchNames:
      - dustpan
  endpoints:
    - port: http
      path: /api/server/metrics
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: opendustpan-ca
            key: ca.crt
        serverName: "dustpan.example"
      interval: 30s
      scrapeTimeout: 10s
      authorization:
        type: Bearer
        credentials:
          name: opendustpan-metrics-token
          key: token
