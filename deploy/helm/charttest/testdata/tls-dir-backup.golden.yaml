# Source: opendustpan/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-opendustpan
  labels:
    helm.sh/chart: opendustpan-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: opendustpan
    app.kubernetes.io/name: opendustpan
    app.kubernetes.io/instance: release
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opendustpan
      app.kubernetes.io/instance: release
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opendustpan
        app.kubernetes.io/instance: release
        app.kubernetes.io/component: server
      annotations:
        checksum/console-config: b301ca36c0a8e7115e731b40e03d8e01f6b75d6b5cdf1c4aa7054ef53102b9fb
    spec:
      serviceAccountName: release-opendustpan
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "ghcr.io/opendustpan/opendustpan:0.1.0"
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - "--log-level=info"
            - "--log-format=json"
            - --console-dir=/console
            - --blob-dir=/data/blobs
            - --backup-target=dir:/backups
          env:
            - name: DUSTPAN_LISTEN
              value: ":8080"
            - name: DUSTPAN_DATABASE
              valueFrom:
                secretKeyRef:
                  name: opendustpan-database
                  key: url
            - name: DUSTPAN_KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: opendustpan-key-encryption-key
                  key: key-encryption-key
            - name: DUSTPAN_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opendustpan-admin-token
                  key: admin-token
            - name: DUSTPAN_TLS_CERT
              value: /tls/tls.crt
            - name: DUSTPAN_TLS_KEY
              value: /tls/tls.key
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTPS
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTPS
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              scheme: HTTPS
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: blobs
              mountPath: /data/blobs
            - name: backups
              mountPath: /backups
            - name: console-config
              mountPath: /console/config.json
              subPath: config.json
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: blobs
          persistentVolumeClaim:
            claimName: opendustpan-existing-blobs
        - name: backups
          persistentVolumeClaim:
            claimName: release-opendustpan-backups
        - name: console-config
          configMap:
            name: release-opendustpan-console
        - name: tls
          secret:
            secretName: opendustpan-tls
            defaultMode: 0440
