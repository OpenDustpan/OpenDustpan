            - "--s3-region=eu-west-1"
          env:
            - name: DUSTPAN_LISTEN
              value: ":8080"
            - name: DUSTPAN_DATABASE
              valueFrom:
                secretKeyRef:
                  name: "123"
                  key: "true"
            - name: DUSTPAN_KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: "456"
                  key: "false"
            - name: DUSTPAN_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "789"
                  key: "1e3"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: "321"
                  key: "123"
            - name: AWS_SECRET_ACCESS_KEY
