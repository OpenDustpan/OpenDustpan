# Every change must pass the same gates locally (make check) and here.
# Actions are pinned to commit SHAs; the comment names the release.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  # The merge queue runs all jobs on the merge group (the pull request on top
  # of the newest main and of the pull requests ahead of it). The queue merges
  # only after each required job passes. Every job here runs on this event.
  merge_group:
    types: [ checks_requested ]
  # Every 2 hours, the go and store jobs on main run each test package again
  # without the test cache (GO_TEST_COUNT=-count=1), to find flaky tests. The
  # lint job also runs, so that make vuln finds a new advisory, and so does the
  # semgrep job. The other jobs do not run on the schedule.
  # GitHub sends the failure notification of a scheduled run to the user who
  # last changed this cron line.
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

# A new push to a pull request cancels the run for the older head of that pull
# request. Runs of main, of the merge queue and scheduled runs are never
# canceled: only a run of main that ends saves the Go cache entries, so a
# canceled run left the go job with an old entry or none. A new push to main
# waits for the run in progress, and replaces only a run that has not started,
# so at most one run of main waits.
# A draft pull request runs every job, as a ready one does. A scheduled run
# has its own group, so it never replaces a pending push run for the same
# commit. A merge group has no pull request number, so its group holds the
# commit of the merge group. The push run after a merge can have the same
# commit, so the merge-group suffix keeps the two groups apart.
# cancel-closed-pr.yml must keep the group of a pull request.
concurrency:
  group: ${{ github.event_name == 'push' && 'ci-main' || format('ci-{0}{1}{2}', github.event.pull_request.number || github.sha, github.event_name == 'schedule' && '-schedule' || '', github.event_name == 'merge_group' && '-merge-group' || '') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job has its own GitHub-hosted runner (ubuntu-26.04), so the jobs share
# no disk and no port. The Go build cache (with the test results) and the Go
# module cache are kept with the GitHub Actions cache, one entry for each job
# and commit. A cache key can be written only once, so the key holds the
# commit, and a job restores the newest entry of its own job. Only push and
# scheduled runs on main save an entry. Pull requests and merge groups only
# restore, so they cannot change the cache that main uses. GitHub removes the
# least recently used entries when the repository is above its cache limit
# (10 GB). One entry of each job was about 11.7 GB, so each run on main
# removed the entries of the run before it, and a job often found no entry.
# A job that builds about what another job builds sets GO_CACHE_FROM to that
# job: it restores the entry of that job and saves none. The entries that
# remain are about 4.5 GB, so the entries of two runs fit in the limit.

# Which jobs run (the changes job sets the outputs):
# - push and schedule: every job (schedule keeps its own limits).
# - merge_group that changes only docs or OpenSpec files against its base (the
#   main under the group, so the change of each pull request in the group):
#   lint, semgrep and scan. The code of the group is then the code of main,
#   which the queue already gated.
# - other merge_group: every job, so the queue gates each change of code on
#   the full set.
# - pull_request with the label full-ci: every job. The label applies from the
#   next push to the pull request; a re-run reads the labels of the old event.
# - pull_request that changes only docs or OpenSpec files: lint, semgrep and
#   scan. lint holds docs-lint (with the check of openspec/specs) and the ADR
#   index check.
# - other pull_request: lint, semgrep, golangci-lint, golangci-lint-journal,
#   nilaway, go and scan, plus each suite whose own files changed.
# A job that its condition skips reports "skipped", and a required check
# accepts "skipped". If the changes job fails, each job runs (fail closed).
jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      e2e: ${{ steps.classify.outputs.e2e }}
      store: ${{ steps.classify.outputs.store }}
      bench: ${{ steps.classify.outputs.bench }}
      journal: ${{ steps.classify.outputs.journal }}
      chart: ${{ steps.classify.outputs.chart }}
    steps:
      # The checkout of a pull_request event is the merge commit of the pull
      # request on top of its base. Its first parent is the base, so depth 2
      # is enough for the diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify the changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -uo pipefail
          outputs="code e2e store bench journal chart"
          run_all() {
            for o in $outputs; do echo "$o=true" >> "$GITHUB_OUTPUT"; done
            echo "Every job runs: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          case "$EVENT_NAME" in
            pull_request)
              [ "$FULL_CI_LABEL" = true ] && run_all "label full-ci"
              git rev-parse --verify -q 'HEAD^2' >/dev/null || run_all "HEAD is not a merge commit"
              files=$(git diff --name-only --no-renames 'HEAD^1' HEAD) || run_all "git diff failed"
              ;;
            merge_group)
              # The base of the group can be more than one commit below HEAD,
              # so the step fetches it. A tree diff needs no common history.
              [[ "$MERGE_GROUP_BASE" =~ ^[0-9a-f]{40}$ ]] || run_all "the merge group base is not a commit id"
              git fetch -q --no-tags --depth=1 origin "$MERGE_GROUP_BASE" || run_all "fetch of the merge group base failed"
              files=$(git diff --name-only --no-renames "$MERGE_GROUP_BASE" HEAD) || run_all "git diff failed"
              ;;
            *) run_all "event $EVENT_NAME" ;;
          esac
          [ -n "$files" ] || run_all "no changed path"
          code=false e2e=false store=false bench=false journal=false chart=false
          while IFS= read -r f; do
            case "$f" in
              .github/*|Makefile|go.mod|go.sum) run_all "$f changed" ;;
            esac
            # Docs only: openspec/, .repowise/ and Markdown files at the root.
            # Go tests read docs/: the route test reads docs/guides and
            # docs/reference, and the ADR number test walks every .md file
            # under docs/. So a path under docs/ is code. No Go code reads
            # openspec/.
            case "$f" in
              docs/*) code=true ;;
              openspec/*|.repowise/*) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
            case "$f" in
              e2e/*|internal/api/pulumi/*|internal/api/tfe/*|internal/pulumijournal/*|pkg/dustpan/*|cmd/opendustpan/*|internal/store/*/migrations/*|scripts/e2e-*|scripts/toxiproxy.sh) e2e=true ;;
              # The e2e tests read these docs: the page tests, the page lists
              # and the check of the commands in the pages.
              docs/guides/*|docs/reference/*|docs/commands-*.txt|README.md) e2e=true ;;
            esac
            case "$f" in
              pkg/store/*|internal/store/*|internal/pgtest/*|pkg/*test/*) store=true ;;
            esac
            case "$f" in
              pkg/stack/*|internal/store/sqlite/*) bench=true ;;
            esac
            case "$f" in
              internal/api/pulumi/*|internal/pulumijournal/*|pkg/dustpan/*|pkg/stack/*) journal=true ;;
            esac
            case "$f" in
              deploy/helm/*|scripts/chart-lint.sh) chart=true ;;
            esac
          done <<< "$files"
          # The queue skips jobs only for a group of docs and OpenSpec files. A
          # group that changes anything else runs every job, not only the
          # suites of its paths.
          if [ "$EVENT_NAME" = merge_group ]; then
            for v in "$code" "$e2e" "$store" "$bench" "$journal" "$chart"; do
              [ "$v" = false ] || run_all "the merge group changes more than docs"
            done
          fi
          {
            echo "code=$code"; echo "e2e=$e2e"; echo "store=$store"
            echo "bench=$bench"; echo "journal=$journal"; echo "chart=$chart"
          } >> "$GITHUB_OUTPUT"
          echo "code=$code e2e=$e2e store=$store bench=$bench journal=$journal chart=$chart" >> "$GITHUB_STEP_SUMMARY"

  # The checks that need no database. They run apart from the tests.
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The job id keeps the jobs apart; a job with GO_CACHE_FROM uses the
      # entry of that job. go.mod holds the Go version, so a new toolchain
      # starts from a new prefix.
      - &go-cache-restore
        name: Restore the Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ env.GO_CACHE_FROM || github.job }}-${{ strategy.job-index }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_CACHE_FROM || github.job }}-${{ strategy.job-index }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-${{ runner.os }}-${{ env.GO_CACHE_FROM || github.job }}-${{ strategy.job-index }}-
      # A pull request with the label nolint-approved skips this step. The
      # three-dot diff needs the history back to the merge base, so the step
      # fetches main with its history; the checkout of the job stays shallow.
      - name: No added suppression marker
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'nolint-approved') }}
        run: |
          git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main
          make nolint-check BASE=origin/main
      # The check reads the index of the checkout, so it runs on each event.
      - name: No tracked file matches a .gitignore rule
        run: make ignored-check
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Verify module checksums
        run: go mod verify
      - name: Each module version is at least 14 days old
        run: |
          python3 -I scripts/module-age-gate.py --selftest
          python3 -I scripts/module-age-gate.py
      - name: The server module needs no dependency of the runner
        run: |
          python3 -I scripts/runner-deps-guard.py --selftest
          python3 -I scripts/runner-deps-guard.py
      - name: The test selection of make test-changed passes its self-test
        run: python3 -I scripts/test-changed.py --selftest
      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: "1.31.1"
      - name: Generated SQL code is up to date
        run: sqlc diff
      - name: Generated TypeScript client is up to date
        run: make clients-check
      - name: No check reads a variable that a parallel subtest writes
        run: make subtestcheck
      - name: No release path uses the journal recording build
        run: make journal-guard
      - name: Known vulnerabilities
        run: make vuln
      - name: Each linked module has a license file to ship
        run: make licenses
      - name: Docs follow ASD-STE100
        run: make docs-lint
      # The OpenSpec CLI comes from npm at the version that the Makefile pins.
      # It runs on the node of the runner image, with telemetry off.
      - name: OpenSpec changes and specs are valid
        run: make openspec-validate
      - name: The release record checks pass
        run: make release-record-check
      # The files check reads the files that the change adds against the merge
      # base with main. It runs on pull requests and in the merge queue, so
      # every change that reaches main is checked. An earlier step can have
      # fetched main with its history already; a second --unshallow fails.
      - name: No large or binary file
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main
          else
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          fi
          make files-check FILES_BASE=origin/main
      # A pull request that completes an OpenSpec change archives it. The step
      # before this one fetched main with its history.
      - name: A completed OpenSpec change is archived
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        run: make change-archived-check BASE_REF=origin/main
      # A failed job saves too: its build cache is still valid. The key is the
      # one that the restore step computed. A job with GO_CACHE_FROM saves no
      # entry: the job that it names saves the entry.
      - &go-cache-save
        name: Save the Go caches
        if: ${{ !cancelled() && !env.GO_CACHE_FROM && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Semgrep runs in a job of its own, next to the lint job: it was about half
  # of the time of lint. Its rules cover Go, the Dockerfile, the workflows and
  # secrets in any file, docs too, so it runs on each event that lint runs on.
  # It needs no Go toolchain.
  semgrep:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep
        env:
          SEMGREP_VERSION: 1.178.0
        run: pipx install "semgrep==$SEMGREP_VERSION"
      - name: Semgrep rules
        run: make semgrep

  # The three long static checks run in jobs of their own, next to the lint
  # job. A new commit is needed to change their result, so they do not run on
  # the schedule.
  golangci-lint:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      # A runner with no lint cache needs more than the 5 minutes that
      # .golangci.yml gives a local run.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=15m
      - *go-cache-save

  # The journal recording build needs a second lint run, because some files
  # are left out of that build and one run cannot hold both. The make target
  # holds the build tag, so this file never names it and the release guard
  # (make journal-guard) stays clean. The install-only step puts
  # golangci-lint on the PATH and skips the lint cache of the action.
  golangci-lint-journal:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    env:
      GO_CACHE_FROM: golangci-lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
          skip-cache: true
      - name: Lint the journal recording build
        run: make lint-journal-build LINT_FLAGS=--timeout=15m
      - *go-cache-save

  nilaway:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      # make nilaway lets the analysis use up to 12 GiB. The runner of a
      # public repository has 16 GB.
      - name: Nil-panic analysis
        run: make nilaway
      - *go-cache-save

  go:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    services:
      postgres:
        # The Go test cache does not see the image. The digest makes sure that
        # the image changes only in a commit, not under cached test results. The
        # scheduled uncached run tests each new digest.
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        # A fixed port keeps DUSTPAN_TEST_POSTGRES_URL the same from job to job,
        # so go test can use cached results. Each job has its own runner, so
        # the port is free.
        ports: [ "5432:5432" ]
        # A parallel query keeps its shared memory in /dev/shm, and the Docker
        # default of 64 MiB is too small for the tests.
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # The S3-compatible server of the pkg/blob/s3 suite: RustFS, pinned by
      # digest. The access key and the secret key are fixed test values, not
      # secrets: the container lives only for this job and holds only test
      # objects. A pull request from a fork gets no repository secret, so a
      # secret would skip the suite there.
      rustfs:
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ROOT_USER: dustpan-test
          RUSTFS_ROOT_PASSWORD: dustpan-test-secret  # trufflehog:ignore fixed test credential; the container holds only test objects
        ports: [ "9000:9000" ]
        # The image has curl. The steps start only after /health/ready
        # answers 200.
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health/ready"
          --health-interval 2s --health-timeout 5s --health-retries 30
    # The four variables turn on TestConformance of pkg/blob/s3. Without them,
    # the suite skips.
    env:
      DUSTPAN_TEST_S3_ENDPOINT: http://localhost:9000
      DUSTPAN_TEST_S3_BUCKET: dustpan-ci-s3
      DUSTPAN_TEST_S3_ACCESS_KEY: dustpan-test
      DUSTPAN_TEST_S3_SECRET_KEY: dustpan-test-secret  # trufflehog:ignore fixed test credential; the suite uses it only against the job container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      # The service waits for /health/ready before the steps start. This step
      # also waits for the S3 API itself, so that a health answer that comes
      # before the API is ready cannot fail the bucket step. Each call has a
      # connect and a read timeout, and the step has a limit, so a server that
      # stops answering fails the job fast.
      - name: Wait for the S3 API
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ env.DUSTPAN_TEST_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.DUSTPAN_TEST_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for _ in $(seq 60); do
            if aws s3api list-buckets --endpoint-url "$DUSTPAN_TEST_S3_ENDPOINT" --cli-connect-timeout 2 --cli-read-timeout 5 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "RustFS did not answer the S3 API" >&2
          exit 1
      # The AWS CLI is on the runner image, so this step needs no action and
      # no tool in the repository. The suite does not make its bucket: the
      # store under test has no bucket operation. A bucket that this account
      # holds already is a pass, so a rerun on the same server passes.
      - name: Make the bucket of the S3 suite
        env:
          AWS_ACCESS_KEY_ID: ${{ env.DUSTPAN_TEST_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.DUSTPAN_TEST_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          if ! out=$(aws s3api create-bucket --endpoint-url "$DUSTPAN_TEST_S3_ENDPOINT" --region us-east-1 --cli-connect-timeout 2 --cli-read-timeout 5 --bucket "$DUSTPAN_TEST_S3_BUCKET" 2>&1); then
            case "$out" in
              *BucketAlreadyOwnedByYou*|*BucketAlreadyExists*) echo "bucket $DUSTPAN_TEST_S3_BUCKET exists" ;;
              *) echo "$out" >&2; exit 1 ;;
            esac
          fi
      # Pushes and pull requests use the test cache. The schedule runs every
      # package again (GO_TEST_COUNT=-count=1). The two store packages run in
      # the store job.
      - name: Test
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: make test-ci-other ${{ github.event_name == 'schedule' && 'GO_TEST_COUNT=-count=1' || '' }}
      # A skipped TestConformance passes the step above. This step runs the
      # suite again against the server of this job (no test cache) and fails
      # unless the top test passed, the package result is ok, and each SKIP
      # line is one of the pending cases that no adapter implements yet.
      - name: The S3 suite ran and passed
        shell: bash
        run: |
          set +e
          go test -count=1 -run '^TestConformance$' -v ./pkg/blob/s3/ | tee "$RUNNER_TEMP/s3-suite.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "pkg/blob/s3 TestConformance failed" >&2
            exit 1
          fi
          if ! grep -qE -x -- '--- PASS: TestConformance \([0-9.]+s\)' "$RUNNER_TEMP/s3-suite.log"; then
            echo "pkg/blob/s3 TestConformance did not pass" >&2
            exit 1
          fi
          if ! grep -qE -- '^ok[[:space:]]' "$RUNNER_TEMP/s3-suite.log"; then
            echo "pkg/blob/s3 package result is not ok" >&2
            exit 1
          fi
          # The five cases of blobtest.runPending skip by design until their
          # adapter work lands. Each one that lands drops out of this list. A
          # SKIP line of any other test fails this step.
          pending='TestConformance/(second_put_on_one_key_replaces_it_or_fails_with_ErrExists|parallel_put_on_one_key_leaves_one_whole_object|get_during_a_replace_returns_the_whole_old_or_the_whole_new_object|failed_replace_leaves_the_old_object|delete_many_removes_every_key_and_backs_off_on_ErrThrottled)'
          if grep -E -- '^[[:space:]]*--- SKIP: ' "$RUNNER_TEMP/s3-suite.log" | grep -vE -- "^[[:space:]]*--- SKIP: ${pending} \([0-9.]+s\)$"; then
            echo "pkg/blob/s3 holds a SKIP line outside the pending cases" >&2
            exit 1
          fi
      - name: Build
        run: go build ./cmd/opendustpan
      - *go-cache-save

  # The benchmarks run once each, next to the go job. They need no database,
  # and a new commit is needed to change their result, so they do not run on
  # the schedule.
  bench:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.bench == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      - name: Benchmarks run once
        run: make bench
      - *go-cache-save

  # The tests of the journal recording build. This build has its own tag, so
  # the go job does not run these tests. The make target holds the tag.
  journal-test:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.journal == 'true') }}
    runs-on: ubuntu-26.04
    env:
      GO_CACHE_FROM: go
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      - name: Journal route tests of the recording build
        run: make journal-test
      - *go-cache-save

  # The SQLite and PostgreSQL store packages are the two longest test
  # packages, and both are CPU-bound. Each one runs in a job of its own, so
  # that it does not share the cores of a runner with the other or with the
  # rest of go test. They are two jobs and not a matrix: a matrix job that its
  # condition skips reports one check named "store", and the required checks
  # "store (sqlite)" and "store (postgres)" would wait forever.
  store-sqlite:
    name: store (sqlite)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.store == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      - name: Test
        run: make test-ci-store STORE=sqlite ${{ github.event_name == 'schedule' && 'GO_TEST_COUNT=-count=1' || '' }}
      - *go-cache-save

  store-postgres:
    name: store (postgres)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.store == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    services:
      postgres:
        # The same image as the go job.
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      # The runner throws the service container away after the job, so its
      # data needs no durability. Without fsync, each checkpoint of a store
      # test run needs less disk time. These settings change only what
      # PostgreSQL keeps after a crash of the machine, not what a query
      # returns. The crash-test job keeps the defaults.
      # make test-ci-store runs 16 cases at a time (STORE_TEST_PARALLEL), and a
      # case can hold the pools of up to 3 stores, so the server takes 300
      # connections instead of the 100 of the default. A drop of the schema of
      # a case takes one lock for each object in it, about a thousand, and the
      # lock table holds max_locks_per_transaction times max_connections
      # locks: with the default of 64, 16 drops at a time filled it ("out of
      # shared memory", SQLSTATE 53200). 256 gives 76,800 locks. Both settings
      # apply only at a start, so the step restarts the container and waits
      # for it. The port mapping 5432:5432 is fixed, so the restart keeps the
      # port.
      - name: Tune the test PostgreSQL
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -q \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "ALTER SYSTEM SET max_connections = 300" \
            -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart "$PG_CONTAINER" > /dev/null
          for _ in $(seq 60); do
            docker exec "$PG_CONTAINER" pg_isready -U postgres -q && break
            sleep 1
          done
          docker exec "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -tA \
            -c "SHOW max_connections" -c "SHOW max_locks_per_transaction"
      # The runner throws the service container away after the job, so the
      # PostgreSQL tests keep their database at the end
      # (DUSTPAN_TEST_SKIP_FINAL_DROP). The variable also keeps the test
      # database and the template of a run that fails. Set it only for a
      # disposable server that is isolated to one run, never for a shared
      # server. A local run drops the database.
      - name: Test
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
          DUSTPAN_TEST_SKIP_FINAL_DROP: "1"
        run: make test-ci-store STORE=postgres ${{ github.event_name == 'schedule' && 'GO_TEST_COUNT=-count=1' || '' }}
      - *go-cache-save

  # Trivy and TruffleHog (make trivy, make trufflehog). The binaries come from
  # the upstream releases, and each archive is checked against the SHA-256
  # pinned here. Change a version together with its checksum and the Makefile.
  scan:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      GO_CACHE_FROM: lint
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      TRUFFLEHOG_VERSION: 3.99.2
      TRUFFLEHOG_SHA256: 3c7b0d1dc4278294269bfdd7594bca8bb28c78da0a4a06ad202ded37b48deca4
    steps:
      # TruffleHog scans the Git history, so fetch all of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The Trivy license scan reads the Go module cache (make trivy).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      - name: Restore the scan tool archives
        id: scan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scan-archives
          key: scan-tools-${{ runner.os }}-trivy-${{ env.TRIVY_VERSION }}-${{ env.TRIVY_SHA256 }}-trufflehog-${{ env.TRUFFLEHOG_VERSION }}-${{ env.TRUFFLEHOG_SHA256 }}
      - name: Install Trivy and TruffleHog
        env:
          SCAN_ARCHIVES: ${{ runner.temp }}/scan-archives
        run: |
          set -euo pipefail
          mkdir -p "$SCAN_ARCHIVES" "$RUNNER_TEMP/scan" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/scan"

          download() {
            url=$1
            dest=$2
            attempt=1
            wait=5
            while [ "$attempt" -le 5 ]; do
              if curl -fsSL --max-time 120 -o "$dest.part" "$url"; then
                mv "$dest.part" "$dest"
                return 0
              fi
              rm -f "$dest.part"
              if [ "$attempt" -lt 5 ]; then
                sleep "$wait"
                wait=$((wait * 2))
              fi
              attempt=$((attempt + 1))
            done
            echo "error: cannot download $url" >&2
            return 1
          }

          fetch() {
            archive=$1
            url=$2
            sum=$3
            if [ -f "$SCAN_ARCHIVES/$archive" ] && \
              echo "$sum  $SCAN_ARCHIVES/$archive" | sha256sum -c - >/dev/null 2>&1; then
              cp "$SCAN_ARCHIVES/$archive" "$archive"
              return 0
            fi
            download "$url" "$archive"
          }

          fetch trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            "$TRIVY_SHA256"
          fetch trufflehog.tar.gz \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
            "$TRUFFLEHOG_SHA256"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          echo "${TRUFFLEHOG_SHA256}  trufflehog.tar.gz" | sha256sum -c -
          cp trivy.tar.gz trufflehog.tar.gz "$SCAN_ARCHIVES/"
          tar -xzf trivy.tar.gz -C "$HOME/.local/bin" trivy
          tar -xzf trufflehog.tar.gz -C "$HOME/.local/bin" trufflehog
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Save the scan tool archives
        if: ${{ success() && steps.scan-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scan-archives
          key: ${{ steps.scan-cache.outputs.cache-primary-key }}
      - name: Trivy scan
        run: make trivy
      - name: TruffleHog scan
        run: make trufflehog
      - *go-cache-save

  # The Helm chart (make chart-lint): helm lint, helm template and kubeconform.
  # The runner image has Helm. kubeconform is built from the pinned version of
  # its module, as make nilaway and make vuln build their tools.
  chart-lint:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.chart == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint and render the Helm chart
        run: make chart-lint
      - *go-cache-save

  # The gate for every endpoint (AGENTS.md): real Pulumi CLI and OpenTofu
  # binaries drive the server on SQLite and on PostgreSQL.
  e2e:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 70
    services:
      # The e2e-journal, upgrade-test, crash-test and faults jobs use the same
      # service.
      postgres: &postgres-service
        # The Go test cache does not see the image. The digest makes sure that
        # the image changes only in a commit, not under cached test results. The
        # scheduled uncached run tests each new digest.
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        # A fixed port keeps DUSTPAN_TEST_POSTGRES_URL the same from job to job,
        # so go test can use cached results. Each job has its own runner, so
        # the port is free.
        ports: [ "5432:5432" ]
        # A parallel query keeps its shared memory in /dev/shm, and the Docker
        # default of 64 MiB is too small for the tests.
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      # The CLI archives are kept in one cache entry. A cache key is written
      # only once, so the entry has a key that changes when its content must
      # change. The pinned versions are in e2e/tool.go, so the key holds the
      # hash of that file. On a download, the e2e fetcher checks each archive
      # against its pinned sum and retries a failed download. On a cache hit,
      # it runs the extracted binary without a sum check. The newest releases
      # run only in the nightly workflow.
      - &cache-clis
        name: Cache the pinned CLI archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/opendustpan-e2e
          key: e2e-clis-pinned-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/tool.go') }}
      - name: End-to-end suite
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
          E2E_PULUMI_VERSIONS: pinned
          E2E_TOFU_VERSIONS: pinned
        run: make e2e
      - &show-report
        name: Show the report
        if: ${{ !cancelled() }}
        run: |
          if [ -f e2e/report/summary.md ]; then
            cat e2e/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - *go-cache-save

  # The shorter tests that drive the server binary: the journal route, an
  # upgrade, a crash and network faults. Each one runs in a job of its own,
  # next to the e2e suite.
  e2e-journal:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-26.04
    env:
      GO_CACHE_FROM: e2e
    timeout-minutes: 70
    services:
      postgres: *postgres-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      - *cache-clis
      - name: Journal end-to-end tests
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: make e2e-journal
      - *show-report
      - *go-cache-save

  upgrade-test:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-26.04
    env:
      GO_CACHE_FROM: e2e
    timeout-minutes: 60
    services:
      postgres: *postgres-service
    steps:
      # The upgrade and mixed-version tests read the v* tags, so fetch all of the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      - *cache-clis
      # Without a v* tag, only the empty-database case runs.
      - name: Upgrade test
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
          E2E_PULUMI_VERSIONS: pinned
          E2E_TOFU_VERSIONS: pinned
        run: make upgrade-test
      # Serves the binary of each of the last 2 v* tags next to the current
      # binary on one database. Without a v* tag, a second process of the
      # current binary is the peer.
      - name: Mixed-version test
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
          E2E_PULUMI_VERSIONS: pinned
          E2E_TOFU_VERSIONS: pinned
        run: make mixed-version-test
      - *show-report
      - *go-cache-save

  crash-test:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-26.04
    env:
      GO_CACHE_FROM: e2e
    timeout-minutes: 40
    services:
      postgres: *postgres-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      - *cache-clis
      - name: Crash test
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
          E2E_PULUMI_VERSIONS: pinned
          E2E_TOFU_VERSIONS: pinned
        run: make crash-test
      - *show-report
      - *go-cache-save

  faults:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-26.04
    env:
      GO_CACHE_FROM: e2e
    timeout-minutes: 40
    services:
      postgres: *postgres-service
      # The network fault tests (make faults) drive this Toxiproxy server.
      # Toxiproxy is a test-only tool and never ships.
      toxiproxy:
        # The digest makes sure that the image changes only in a commit, like
        # the PostgreSQL image.
        image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
        # 8474 is the API. The tests give each proxy a fixed port from
        # TOXIPROXY_PORT_BASE (8475) to TOXIPROXY_PORT_BASE + 3, and the
        # client dials each proxy on the same port of the runner.
        ports: [ "8474:8474", "8475-8478:8475-8478" ]
        # The proxies dial the test server and PostgreSQL on the runner
        # through this name.
        options: >-
          --add-host=host.docker.internal:host-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - *go-cache-restore
      - *cache-clis
      - name: Network fault tests
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
          E2E_PULUMI_VERSIONS: pinned
          E2E_TOFU_VERSIONS: pinned
          TOXIPROXY_URL: http://localhost:${{ job.services.toxiproxy.ports['8474'] }}
          TOXIPROXY_LISTEN_HOST: 0.0.0.0
          TOXIPROXY_PORT_BASE: "8475"
          TOXIPROXY_UPSTREAM_HOST: host.docker.internal
        run: make faults
      - *show-report
      - *go-cache-save
