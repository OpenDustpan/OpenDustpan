# golangci-lint v2 configuration for OpenDustpan.
#
# Philosophy: everything is on by default. A linter is only disabled with a
# written reason below. This is a gate against sloppy (including AI-generated)
# code, so the bar is "strict but defensible": a disabled linter must be either
# noise, a duplicate of something stricter, or irrelevant to this codebase.
#
# Suppressions: `//nolint:<linter> // <reason>` only. nolintlint rejects
# blanket or unexplained directives.

version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - e2e # Lint the end-to-end package too; make test excludes it.
    - upgrade # Lint the upgrade test with the e2e harness; make check excludes it.
    - soak # Lint the soak run with the e2e harness; make check excludes it.
    - faults # Lint the Toxiproxy fault tests; make test excludes them.
  modules-download-mode: readonly

linters:
  default: all
  disable:
    # --- Explicitly rejected style rules ---
    - noinlineerr # `if err := f(); err != nil` is idiomatic Go and scopes err tightly.
    - wsl # Deprecated; wsl_v5 replaces it.
    - wsl_v5 # Blank-line placement is taste, not correctness; gofumpt owns layout.
    - nlreturn # Same as wsl: whitespace taste.
    - varnamelen # Flags idiomatic short names (i, w, r, tx) whose scope is obvious.
    - exhaustruct # Deprecated alias; exhaustruct_v5 is enabled instead.
    - gomodguard # Deprecated; depguard covers module bans below.
    - gomodguard_v2 # depguard already bans modules at the import level.
    # --- Duplicates of stricter or broader checks ---
    - lll # golines (formatter) enforces the same 120-column limit and auto-fixes it.
    - gocyclo # cyclop + gocognit cover complexity with better signal.
    - goheader # No license headers in files; LICENSE at the root is enough.
    # --- Irrelevant to this codebase (no such dependency) ---
    - arangolint
    - clickhouselint
    - ginkgolinter
    - promlinter
    - protogetter
    - spancheck
    - testifylint # testify is banned outright by depguard.
    - zerologlint
    - loggercheck # slog only; sloglint covers it more strictly.
    - gosmopolitan # Flags non-Latin text; not an i18n concern here.

  settings:
    cyclop:
      max-complexity: 12
      package-average: 0 # Disabled: penalizes small, single-function packages.

    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: github.com/stretchr/testify
              desc: Use the standard library testing package and plain comparisons.
            - pkg: gorm.io
              desc: No ORMs. Hand-written SQL via sqlc, pgx and database/sql.
            - pkg: github.com/jmoiron/sqlx
              desc: Use sqlc-generated queries or pgx/database/sql directly.
            - pkg: entgo.io
              desc: No ORMs or SQL generators.
            - pkg: github.com/labstack/echo
              desc: Use net/http and its ServeMux.
            - pkg: github.com/gofiber/fiber
              desc: Use net/http and its ServeMux.
            - pkg: github.com/pkg/errors
              desc: Use the standard library errors package and fmt.Errorf with %w.
            - pkg: github.com/sirupsen/logrus
              desc: Use log/slog.
            - pkg: go.uber.org/zap
              desc: Use log/slog.
            - pkg: github.com/rs/zerolog
              desc: Use log/slog.
            - pkg: math/rand$
              desc: Use math/rand/v2 or crypto/rand.
            - pkg: io/ioutil
              desc: Deprecated; use io and os.
            - pkg: golang.org/x/crypto/openpgp
              desc: Deprecated and frozen, with its subpackages. Use github.com/ProtonMail/go-crypto/openpgp.
        clientgen:
          # The client generator and the client conformance suite read only
          # the published API description and talk to a server over HTTP.
          # They import no part of the server, so a later move to another
          # module or repository is a move of files. The rule denies the whole
          # server module and allows only the generator itself, so a new
          # server package is fenced off with no change to this rule.
          list-mode: lax
          files:
            - "**/internal/clientgen/**"
            - "**/cmd/clientgen/**"
          allow:
            - opendustpan.org/opendustpan/internal/clientgen
          deny:
            - pkg: opendustpan.org/opendustpan
              desc: The client generator reads the published description; it never imports server code.
        expr:
          # The Expr engine of internal/expr is the only code that imports the
          # library. Everything else uses the selfservice.Evaluator port.
          files:
            - "!**/internal/expr/**"
          deny:
            - pkg: github.com/expr-lang/expr
              desc: Only internal/expr imports the Expr library; use the selfservice.Evaluator port.
        journal:
          # The journal takes bytes and gives bytes (ADR 43, decision 3.3). It
          # imports no part of the server, so a later move to a separate module
          # is a move of files. The glob matches the absolute path of a file.
          files:
            - "**/internal/pulumijournal/**"
            - "!**/*_test.go"
          deny:
            - pkg: opendustpan.org/opendustpan/pkg
              desc: The journal takes bytes and gives bytes; it never imports a pkg/ package (ADR 43, decision 3.3).
            - pkg: opendustpan.org/opendustpan/internal/api
              desc: The journal never imports an API adapter (ADR 43, decision 3.3).
            - pkg: net/http
              desc: HTTP belongs in api/, not in the journal (ADR 43, decision 3.3).
            - pkg: database/sql
              desc: SQL belongs in store/, not in the journal (ADR 43, decision 3.3).
            - pkg: github.com/jackc/pgx
              desc: SQL belongs in store/, not in the journal (ADR 43, decision 3.3).
        launcher:
          # The launcher contract is imported by the runner module, so it
          # imports no part of this server. It never imports internal code,
          # a SQL driver or the forge, so a move to another module is a move
          # of files. Defense in depth: the domain rule also applies to it. For
          # pkg/launcher/proxy, which may import net/http, the launcherproxy
          # rule below repeats the other denials of the domain rule.
          files:
            - "**/pkg/launcher/**"
            - "!**/*_test.go"
          deny:
            - pkg: opendustpan.org/opendustpan/internal
              desc: The launcher contract never imports internal code.
            - pkg: opendustpan.org/opendustpan/pkg/forge
              desc: The launcher contract never imports the forge.
            - pkg: database/sql
              desc: The launcher contract never links a SQL driver.
            - pkg: github.com/jackc/pgx
              desc: The launcher contract never links a SQL driver.
            - pkg: modernc.org/sqlite
              desc: The launcher contract never links a SQL driver.
            - pkg: github.com/mattn/go-sqlite3
              desc: The launcher contract never links a SQL driver.
        launcherproxy:
          # The job proxy is an HTTP proxy, so the domain rule excludes it and
          # it may import net/http. This rule puts back every other denial of
          # the domain rule, so the job proxy keeps the same layers: no store,
          # blob or notify adapter, no transport adapter, no metrics.
          # Defense in depth: the launcher rule also applies to it, and
          # deps_test.go checks every package that it links.
          files:
            - "**/pkg/launcher/proxy/**"
            - "!**/*_test.go"
          deny:
            - pkg: opendustpan.org/opendustpan/pkg/store
              desc: The job proxy depends on ports, never on store adapters.
            - pkg: opendustpan.org/opendustpan/internal/api
              desc: The job proxy must not import transport adapters.
            - pkg: opendustpan.org/opendustpan/pkg/blob/
              desc: The job proxy depends on the blob port, never on an adapter.
            - pkg: opendustpan.org/opendustpan/pkg/notify/
              desc: The job proxy depends on the notify.Sender port, never on a sender adapter.
            - pkg: database/sql
              desc: SQL belongs in store/, not in the job proxy.
            - pkg: github.com/jackc/pgx
              desc: SQL belongs in store/, not in the job proxy.
            - pkg: opendustpan.org/opendustpan/internal/metrics
              desc: The job proxy must not import metrics.
        jobproxy:
          # The launcher links the job proxy core, so it imports no part of
          # this server. It never imports internal code, a SQL driver or the
          # forge. Of this module the core links only the outbound guard
          # (pkg/egress), and the store port is in pkg/jobproxy/rulestore, so a
          # move to another module is a move of files. Defense in depth: the
          # domain rule also applies to it, and deps_test.go checks every
          # package that the core links.
          files:
            - "**/pkg/jobproxy/**"
            - "!**/*_test.go"
          deny:
            - pkg: opendustpan.org/opendustpan/internal
              desc: The job proxy core never imports internal code.
            - pkg: opendustpan.org/opendustpan/pkg/forge
              desc: The job proxy core never imports the forge.
            - pkg: database/sql
              desc: The job proxy core never links a SQL driver.
            - pkg: github.com/jackc/pgx
              desc: The job proxy core never links a SQL driver.
            - pkg: modernc.org/sqlite
              desc: The job proxy core never links a SQL driver.
            - pkg: github.com/mattn/go-sqlite3
              desc: The job proxy core never links a SQL driver.
        githubfake:
          # The fake GitHub host is test infrastructure. No file of the binary
          # (cmd/, pkg/ and internal/) imports it, except a test file, so the
          # binary never links it.
          files:
            - "**/cmd/**"
            - "**/pkg/**"
            - "**/internal/**"
            - "!**/*_test.go"
          deny:
            - pkg: opendustpan.org/opendustpan/e2e/githubfake
              desc: The fake GitHub host is for tests; the binary never links it.
        ldaptest:
          # The in-process LDAP directory is test infrastructure. No file of
          # the binary imports it, except a test file, so the binary never
          # links it.
          files:
            - "**/cmd/**"
            - "**/pkg/**"
            - "**/internal/**"
            - "!**/*_test.go"
            - "!**/internal/ldaptest/**"
          deny:
            - pkg: opendustpan.org/opendustpan/internal/ldaptest
              desc: The test LDAP directory is for tests; the binary never links it.
        domain:
          # Domain packages must not depend on adapters, transports or drivers.
          # api/inventory is an HTTP adapter, not the domain package
          # inventory, so it is excluded below.
          # The globs match the absolute path of a file, so each one names
          # pkg/. A bare "**/workspace/**" also matches a checkout below a
          # directory named workspace, and the rule then applies to all files.
          files:
            - "**/pkg/namespace/**"
            - "**/pkg/stack/**"
            - "**/pkg/identity/**"
            - "**/pkg/secret/**"
            - "**/pkg/workspace/**"
            - "**/pkg/inventory/**"
            - "**/pkg/ipallow/**"
            - "**/pkg/audit/**"
            - "**/pkg/principal/**"
            - "**/pkg/access/**"
            - "**/pkg/accesstoken/**"
            - "**/pkg/session/**"
            - "**/pkg/localuser/**"
            - "**/pkg/mfa/**"
            - "**/pkg/backup/**"
            - "**/pkg/collection/**"
            - "**/pkg/maintenance/**"
            - "**/pkg/durable/**"
            - "**/internal/agent/**"
            - "**/pkg/job/**"
            - "**/pkg/history/**"
            - "**/internal/dependency/**"
            - "**/pkg/graph/**"
            - "**/pkg/reviewrequest/**"
            - "**/pkg/objectcontext/**"
            - "**/internal/unmanaged/**"
            - "**/pkg/drift/**"
            - "**/pkg/trigger/**"
            - "**/pkg/trustrule/**"
            - "**/pkg/outputshare/**"
            - "**/pkg/savedview/**"
            - "**/pkg/jobtoken/**"
            - "**/pkg/unitsettings/**"
            - "**/pkg/preferences/**"
            - "**/pkg/setting/**"
            - "**/internal/stepup/**"
            - "**/pkg/registry/**"
            - "**/internal/registry/**"
            - "**/pkg/runner/**"
            - "**/pkg/launcher/**"
            - "**/pkg/jobproxy/**"
            - "**/internal/source/**"
            - "**/pkg/source/**"
            - "**/pkg/forge/*.go"
            - "**/pkg/forgelink/**"
            - "**/internal/scopeaudit/**"
            - "**/internal/calendar/**"
            - "**/internal/freeze/**"
            - "**/pkg/breakglass/**"
            - "**/pkg/tempadmin/**"
            - "**/internal/oncall/**"
            - "**/internal/cost/**"
            - "**/pkg/notify/*.go"
            - "**/pkg/egress/*.go"
            - "**/internal/chatops/**"
            - "**/internal/incident/**"
            - "**/internal/selfservice/**"
            - "**/internal/policy/**"
            - "**/pkg/gate/**"
            - "**/internal/quota/**"
            - "**/pkg/blob/*.go"
            - "**/pkg/logsink/*.go"
            - "**/internal/unitimport/*.go"
            - "**/pkg/installation/**"
            - "**/internal/cron/**"
            - "**/pkg/idempotency/**"
            - "**/pkg/manuallock/**"
            - "**/pkg/profile/**"
            - "**/internal/*svc/**"
            - "!**/*_test.go"
            - "!**/internal/api/inventory/**"
            # The job proxy is an HTTP proxy, so it imports net/http on
            # purpose. The launcher rule still applies to it: no internal
            # code, no forge, no SQL driver.
            - "!**/pkg/launcher/proxy/**"
          deny:
            - pkg: opendustpan.org/opendustpan/pkg/store
              desc: Domain code depends on ports, never on store adapters.
            - pkg: opendustpan.org/opendustpan/internal/api
              desc: Domain code must not import transport adapters.
            - pkg: opendustpan.org/opendustpan/pkg/blob/
              desc: Domain code depends on the blob port, never on an adapter.
            - pkg: opendustpan.org/opendustpan/pkg/notify/
              desc: Domain code depends on the notify.Sender port, never on a sender adapter.
            - pkg: net/http
              desc: HTTP belongs in api/, not in the domain.
            - pkg: database/sql
              desc: SQL belongs in store/, not in the domain.
            - pkg: github.com/jackc/pgx
              desc: SQL belongs in store/, not in the domain.
            - pkg: opendustpan.org/opendustpan/internal/metrics
              desc: Domain code must not import metrics; only dustpan.go and HTTP middleware do.
        tempadmin:
          # The adapter reads the client address and the request ID of a
          # temporary administrator request, so this package needs no HTTP
          # code, also not through the helpers that read a request.
          files:
            - "**/pkg/tempadmin/**"
            - "!**/*_test.go"
          deny:
            - pkg: opendustpan.org/opendustpan/internal/clientip
              desc: The HTTP adapter reads the client address; pass it through RequestOf.
            - pkg: opendustpan.org/opendustpan/internal/requestid
              desc: The HTTP adapter reads the request ID; pass it through RequestOf.
        gateleaf:
          # pkg/gate is a leaf of the domain graph: the owner packages of the
          # objects that a gate guards import it, so it imports none of them.
          # The globs match the absolute path of a file.
          list-mode: strict
          files:
            - "**/pkg/gate/*.go"
            - "!**/*_test.go"
            - "!**/pkg/gate/gatetest/**"
          allow:
            - $gostd
            - opendustpan.org/opendustpan/internal/ident
            - opendustpan.org/opendustpan/pkg/namespace
            - opendustpan.org/opendustpan/pkg/identity
            - opendustpan.org/opendustpan/pkg/audit
            - opendustpan.org/opendustpan/pkg/collection
        clientpkg:
          # Client commands live in internal/cli/client and take --server:
          # they never open the database, a blob adapter, a backup target or
          # the key-encryption key (ADR 39 decision 4). Only the serve wiring
          # in cmd/opendustpan may import them. The globs match the absolute
          # path of a file. pkg/store/schema stays allowed: it is the neutral
          # migration list both dialects and the clients share, with no driver
          # in it.
          files:
            - "**/internal/cli/client/**"
            - "!**/*_test.go"
          deny:
            - pkg: opendustpan.org/opendustpan/pkg/store/sqlite
              desc: Client commands read schema state through the API, never through a store adapter.
            - pkg: opendustpan.org/opendustpan/pkg/store/postgres
              desc: Client commands read schema state through the API, never through a store adapter.
            - pkg: opendustpan.org/opendustpan/pkg/store/internal
              desc: Client commands share the neutral pkg/store/schema list, never the adapter internals.
            - pkg: opendustpan.org/opendustpan/pkg/blob/fs
              desc: Only the server reads a backup target or blob directory.
            - pkg: opendustpan.org/opendustpan/pkg/blob/s3
              desc: Only the server reads a backup target or blob directory.
            - pkg: opendustpan.org/opendustpan/pkg/secret
              desc: Only the server holds the key-encryption key.
            - pkg: opendustpan.org/opendustpan/internal/api
              desc: Client commands meet the server through its REST API, never through route code.
            - pkg: opendustpan.org/opendustpan/cmd/opendustpan
              desc: Client commands never import the serve wiring that opens the data.

        runnerdeps:
          # The Kubernetes client and the OCI image library are for the runner
          # only (ADR 139). The runner is its own Go module in
          # cmd/dustpan-runner, so the server module does not require them.
          # This rule keeps every file outside that directory, the server
          # packages, the launcher and the tests, from importing them or the
          # runner packages. The globs match the absolute path of a file.
          files:
            - "$all"
            - "!**/cmd/dustpan-runner/**"
          deny:
            - pkg: k8s.io/
              desc: Only the runner speaks to the Kubernetes API; the server never links a Kubernetes client (ADR 139).
            - pkg: sigs.k8s.io/
              desc: Only the runner speaks to the Kubernetes API; the server never links a Kubernetes client (ADR 139).
            - pkg: github.com/google/go-containerregistry/
              desc: Only the machine runner pulls and unpacks OCI images (ADR 139).
            - pkg: opendustpan.org/opendustpan/cmd/dustpan-runner
              desc: The runner module imports the server module, never the reverse (ADR 139).
        faultlog:
          files:
            - "**/internal/api/faultlog/**"
          deny:
            - pkg: opendustpan.org/opendustpan/internal/api/apidesc$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/refusal$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/admit$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/idempotent$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/problem$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/route$
              desc: The import goes against the layer order of the helper packages.
        apidesc:
          files:
            - "**/internal/api/apidesc/**"
          deny:
            - pkg: opendustpan.org/opendustpan/internal/api/refusal$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/admit$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/idempotent$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/problem$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/route$
              desc: The import goes against the layer order of the helper packages.
        refusal:
          files:
            - "**/internal/api/refusal/**"
          deny:
            - pkg: opendustpan.org/opendustpan/internal/api/admit$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/idempotent$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/problem$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/route$
              desc: The import goes against the layer order of the helper packages.
        admit:
          files:
            - "**/internal/api/admit/**"
          deny:
            - pkg: opendustpan.org/opendustpan/internal/api/problem$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/route$
              desc: The import goes against the layer order of the helper packages.
        idempotent:
          files:
            - "**/internal/api/idempotent/**"
          deny:
            - pkg: opendustpan.org/opendustpan/internal/api/problem$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/route$
              desc: The import goes against the layer order of the helper packages.
        problem:
          files:
            - "**/internal/api/problem/**"
          deny:
            - pkg: opendustpan.org/opendustpan/internal/api/route$
              desc: The import goes against the layer order of the helper packages.
        stategate:
          files:
            - "**/internal/api/stategate/**"
          deny:
            - pkg: opendustpan.org/opendustpan/internal/api/pulumi$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/tfe$
              desc: The import goes against the layer order of the helper packages.
            - pkg: opendustpan.org/opendustpan/internal/api/tofuhttp$
              desc: The import goes against the layer order of the helper packages.

    dupl:
      threshold: 120

    errcheck:
      check-type-assertions: true
      check-blank: true

    exhaustive:
      default-signifies-exhaustive: false

    exhaustruct_v5:
      ignore-patterns:
        # Standard library types documented as "zero value is ready / configure what you need".
        - ^net/http\.Server$
        - ^net/http\.Client$
        - ^net/http\.Transport$
        - ^net/http\.Cookie$
        - ^net/http\.Request$
        - ^crypto/tls\.Config$
        - ^log/slog\.HandlerOptions$
        - ^database/sql\.TxOptions$
        - ^net/url\.URL$
        - ^encoding/json\.Decoder$
        - ^os/exec\.Cmd$
        # Not an options bag: exhaustruct demands the deprecated Xattrs field,
        # which staticcheck (SA1019) forbids, so no literal can satisfy both.
        # Exempting the type beats a nolint at every literal.
        - ^archive/tar\.Header$

    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
          msg: Use log/slog, or write to an injected io.Writer.
        - pattern: ^log\.(Print|Fatal|Panic)(|f|ln)$
          msg: Use log/slog and return errors instead of exiting.
        - pattern: ^os\.Exit$
          msg: Only cmd/ may exit; return errors everywhere else.
        - pattern: ^time\.Sleep$
          msg: Use a timer with context cancellation.
        # The query and the headers of a request in the tool-neutral REST
        # API: a handler reads them through apidesc, which allows only the
        # names that the API description declares for the route. The
        # exclusions below limit these patterns to the packages of that API.
        # String and Redacted give back the raw query as part of the URL.
        - pattern: ^url\.URL\.(Query|RawQuery|ForceQuery|RequestURI|String|Redacted)$
          pkg: ^net/url$
          msg: Read the query through apidesc.QueryOf, which allows only the declared names.
        - pattern: ^url\.ParseQuery$
          pkg: ^net/url$
          msg: Read the query through apidesc.QueryOf, which allows only the declared names.
        - pattern: ^http\.Request\.(Header|Form|PostForm|MultipartForm|RequestURI|Trailer|FormValue|PostFormValue|FormFile|ParseForm|ParseMultipartForm|MultipartReader|UserAgent|Referer|Cookie|Cookies|CookiesNamed|BasicAuth)$
          pkg: ^net/http$
          msg: Read the query through apidesc.QueryOf and the headers through apidesc.Header, which allow only the declared names.
      analyze-types: true

    funlen:
      lines: 70
      statements: 45
      ignore-comments: true

    gocognit:
      min-complexity: 15

    goconst:
      min-len: 3
      min-occurrences: 3

    gocritic:
      enable-all: true
      disabled-checks:
        - whyNoLint # nolintlint covers this with stricter rules.
        - unnamedResult # nonamedreturns forbids named results, so this conflicts.
      settings:
        hugeParam:
          # Domain types are immutable values passed by value on purpose; only
          # flag copies that are genuinely large.
          sizeThreshold: 512

    godox:
      keywords:
        - TODO
        - FIXME
        - HACK
        - XXX

    gosec:
      excludes: []

    govet:
      enable-all: true
      disable:
        - fieldalignment # Struct field order follows readability, not padding.
      settings:
        shadow:
          # Strict mode bans `if err := f(); err != nil` whenever an outer err
          # exists, which contradicts allowing inline errors. Non-strict still
          # reports the buggy case: the outer variable used after shadowing.
          strict: false

    inamedparam:
      skip-single-param: false

    interfacebloat:
      max: 8

    ireturn:
      allow:
        - error
        - empty
        - stdlib
        - generic
        # The error translation of the PostgreSQL store wraps the pool and its
        # transactions. sqlc's DBTX interface and the pgx transaction
        # starters require these return types.
        - github.com/jackc/pgx/v5.Rows
        - github.com/jackc/pgx/v5.Row
        - github.com/jackc/pgx/v5.Tx
        - github.com/jackc/pgx/v5.BatchResults

    misspell:
      locale: US

    mnd:
      ignored-functions:
        - ^time\.Duration$
        - ^os\.(Mkdir|MkdirAll|OpenFile|WriteFile|Chmod)$

    nakedret:
      max-func-lines: 0

    nestif:
      min-complexity: 4

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    paralleltest:
      ignore-missing-subtests: false

    revive:
      enable-all-rules: true
      rules:
        # Duplicates of dedicated linters configured above.
        - name: line-length-limit
          disabled: true # golines
        - name: add-constant
          disabled: true # mnd + goconst
        - name: cognitive-complexity
          disabled: true # gocognit
        - name: cyclomatic
          disabled: true # cyclop
        - name: function-length
          disabled: true # funlen
        - name: unhandled-error
          disabled: true # errcheck
        - name: max-public-structs
          disabled: true # Domain packages legitimately export several value types.
        - name: file-header
          disabled: true # No per-file headers.
        - name: banned-characters
          disabled: true # Nothing to ban.
        - name: import-alias-naming
          disabled: true # importas owns aliases.
        - name: comment-spacings
          arguments: ["nolint"]
        - name: unused-receiver
          disabled: true # Methods satisfying ports often ignore the receiver; unparam covers real waste.
        - name: max-control-nesting
          disabled: true # nestif
        - name: function-result-limit
          arguments: [3]
        - name: argument-limit
          arguments: [5]
        - name: package-directory-mismatch
          disabled: true # Adapter packages (store/sqlite) intentionally share short names.

    sloglint:
      no-mixed-args: true
      kv-only: false
      attr-only: true
      no-global: all
      context: scope
      static-msg: true
      key-naming-case: snake
      forbidden-keys:
        - time
        - level
        - msg
        - source

    staticcheck:
      checks:
        - all

    tagliatelle:
      case:
        rules:
          json: goCamel
          yaml: goCamel
        use-field-name: false

    testpackage:
      skip-regexp: _internal_test\.go

    unparam:
      check-exported: true

    usestdlibvars:
      http-method: true
      http-status-code: true
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
      ignore-package-globs:
        - opendustpan.org/opendustpan/*

  exclusions:
    generated: strict
    warn-unused: true
    rules:
      # Tests may use numeric literals and longer table-driven functions. The
      # conformance suites are tests that adapters import, so the same applies.
      - path: (_test\.go$|^pkg/store/storetest/|^pkg/blob/blobtest/|^pkg/secret/secrettest/|^pkg/audit/audittest/|^pkg/principal/principaltest/|^pkg/accesstoken/accesstokentest/|^pkg/session/sessiontest/|^pkg/access/accesstest/|^pkg/durable/durabletest/|^internal/history/historytest/|^pkg/inventory/inventorytest/|^internal/dependency/dependencytest/|^pkg/stack/stackhistorytest/|^pkg/workspace/workspacehistorytest/|^internal/agent/agenttest/|^internal/graph/graphtest/|^pkg/objectcontext/objectcontexttest/|^internal/unmanaged/unmanagedtest/|^pkg/runner/runnertest/|^internal/calendar/calendartest/|^internal/freeze/freezetest/|^internal/breakglass/breakglasstest/|^internal/oncall/oncalltest/|^internal/cost/costtest/|^pkg/notify/notifytest/|^internal/chatops/chatopstest/|^internal/incident/incidenttest/|^internal/selfservice/selfservicetest/|^internal/policy/policytest/|^internal/quota/quotatest/|^pkg/gate/gatetest/|^internal/unitimport/unitimporttest/|^pkg/forge/forgetest/|^pkg/preferences/preferencestest/|^pkg/localuser/localusertest/|^pkg/mfa/mfatest/)
        linters:
          - mnd
          - funlen
          - dupl
          - goconst
      # The ban on direct reads of the query and the headers covers the
      # adapters of the tool-neutral REST API and the helpers that they call.
      # The tool-compatible APIs and the runner protocol keep their own wire
      # formats, and apidesc is the one place that reads the raw request.
      - path-except: ^(internal/api/(audit|drift|idempotent|inventory|issuer|jobs|notifications|objectcontext|profile|refusal|registry|route|selfservice|server|settings|sourcefilter|triggers|trustrules)/|internal/(sessionauth|clientip)/|pkg/dustpan/web\.go$)
        linters:
          - forbidigo
        text: through apidesc
      # A test builds requests and reads answers; it serves no route.
      - path: _test\.go$
        linters:
          - forbidigo
        text: through apidesc
      # The binary entry point is the only place allowed to exit.
      - path: ^cmd/
        linters:
          - forbidigo
        text: os\.Exit

formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gofumpt:
      module-path: opendustpan.org/opendustpan
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
    golines:
      max-len: 120
      tab-len: 4
      shorten-comments: true
      reformat-tags: true
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false # Report every linter's finding, not just the first per line.
  new: false
