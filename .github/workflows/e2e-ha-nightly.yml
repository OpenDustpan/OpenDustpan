# The high availability end-to-end suite (make e2e-ha), once each night on
# main: three server binaries of one installation behind a round-robin proxy,
# on PostgreSQL. The steps are a kill during work, a kill during a backup, and
# the job schedules, next to the full Pulumi and OpenTofu scenarios through the
# proxy. The run keeps the live blobs and the backup target in a directory that
# the instances share, because the CI services do not include an S3-compatible
# server yet. It is slower than the ci.yml e2e job, so pull requests do not run
# it.
# GitHub sends the failure notification of a scheduled run to the user who
# last changed the cron line.
name: e2e-ha-nightly

on:
  # A minute that is not 0, so that the load at the start of the hour does not
  # delay the run.
  schedule:
    - cron: "17 3 * * *"
  # A maintainer can start a run by hand, for example to check a fix.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-ha:
    # A scheduled run uses the default branch. A run by hand must use it too.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    services:
      postgres:
        # The same image as the e2e job of ci.yml.
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The newest Go caches of the e2e job of ci.yml. This run only restores
      # them and saves no entry of its own.
      - name: Restore the Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-e2e-0-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-e2e-0-${{ hashFiles('go.mod', 'go.sum') }}-
            go-${{ runner.os }}-e2e-0-
      # The CLI archives are kept in two cache entries. A cache key is written
      # only once, so each entry has a key that changes when its content must
      # change. The pinned versions are in e2e/tool.go, so that entry has the
      # hash of the file in its key and leaves out the "latest" versions. The
      # "latest" entry has the newest versions in its key, so each new release
      # is downloaded once.
      - name: Find the newest CLI versions
        id: latest-clis
        run: scripts/e2e-latest-clis.sh >> "$GITHUB_OUTPUT"
      - name: Cache the pinned CLI archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/opendustpan-e2e
            !~/.cache/opendustpan-e2e/pulumi-v${{ steps.latest-clis.outputs.pulumi }}-*
            !~/.cache/opendustpan-e2e/tofu_${{ steps.latest-clis.outputs.tofu }}_*
          key: e2e-clis-pinned-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/tool.go') }}
      - name: Cache the latest CLI archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/opendustpan-e2e/pulumi-v${{ steps.latest-clis.outputs.pulumi }}-*
            ~/.cache/opendustpan-e2e/tofu_${{ steps.latest-clis.outputs.tofu }}_*
          key: e2e-clis-latest-${{ runner.os }}-${{ runner.arch }}-pulumi-${{ steps.latest-clis.outputs.pulumi }}-tofu-${{ steps.latest-clis.outputs.tofu }}
      - name: High availability end-to-end suite
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
          # The size of the exit test: 500 MB of checkpoint data in the backup.
          E2E_HA_BACKUP_MB: "500"
        run: make e2e-ha
      - name: Show the report
        if: ${{ !cancelled() }}
        run: |
          for f in e2e/report/ha-alternation-*.json; do
            [ -f "$f" ] || continue
            {
              echo "### Requests per tool and instance: $(basename "$f" .json)"
              echo '```json'
              cat "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
