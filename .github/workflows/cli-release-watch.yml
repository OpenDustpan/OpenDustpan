# The job needs the contract files in e2e/contract/ (they come with the
# change that adds the CLI contract). Until they exist in main, the job finds
# no known version for a tool, does nothing for it, and opens no issue.
# Once each day, finds a new stable release of the Pulumi CLI or of OpenTofu
# and opens one issue for it. A "new" release is a version newer than every
# contract file of that tool in e2e/contract/. The issue names the version and
# the link to its changelog. A person reads the changelog for changes to login,
# state, locks and the console link, and then runs the suite with the new
# version (a "latest" run) and commits the contract file of the version.
# The job needs no secret and runs no code of the CLI. It reads two public
# version lists. Its token can write issues and nothing else.
# GitHub sends the failure notification of a scheduled run to the user who
# last changed the cron line.
name: cli-release-watch

on:
  # A minute that is not 0, so that the load at the start of the hour does not
  # delay the run.
  schedule:
    - cron: "29 6 * * *"
  # A maintainer can start a run by hand, for example to check a change.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    # A scheduled run uses the default branch. A run by hand must use it too.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find a new release and open an issue
        shell: bash
        run: |
          set -euo pipefail

          # The newest version of a tool that has a contract file. A tool with
          # no contract file has no version to compare, so the job does nothing
          # for it.
          newest_known() {
            find e2e/contract -maxdepth 1 -name "$1-*.json" 2>/dev/null \
              | sed -E "s|.*/$1-(.*)\.json|\1|" | sort -V | tail -n 1
          }

          # Opens one issue for a tool and a version, unless an issue with the
          # same title exists, open or closed.
          report() {
            local name=$1 version=$2 changelog=$3 title
            title="New $name release $version: run the suite and check the contract"
            if [ -n "$(gh issue list --state all --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
              echo "$name $version: an issue exists"
              return
            fi
            gh issue create --title "$title" --body "$(printf '%s\n' \
              "A new stable release of $name exists: $version." \
              "" \
              "Changelog: $changelog" \
              "" \
              "1. Read the changelog for changes to login, state, locks, the console link and the service discovery document." \
              "2. Run \`E2E_PULUMI_VERSIONS=$version make e2e\` (or \`E2E_TOFU_VERSIONS\`). The part \"New reads\" of the report lists what the release reads that the newest contract does not have." \
              "3. Run the suite with \`E2E_CONTRACT_UPDATE=1\` and commit the new file in \`e2e/contract/\`." \
              "4. Decide if the version replaces a pinned version (see the matrix policy in \`e2e/doc.go\`)." \
              "" \
              "---" \
              "_Generated by the cli-release-watch workflow_")"
          }

          failed=0

          # Reports the newest stable version of one tool if it is newer than
          # the newest contract file. An empty or bad version sets failed and
          # does not stop the other tool.
          check() {
            local tool=$1 name=$2 changelog=$3 latest=$4 known
            if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "$name: no usable version from the version list" >&2
              failed=1
              return
            fi
            known=$(newest_known "$tool")
            if [ -n "$known" ] && [ "$(printf '%s\n%s\n' "$known" "$latest" | sort -V | tail -n 1)" != "$known" ]; then
              report "$name" "$latest" "${changelog//VERSION/$latest}"
            fi
          }

          pulumi_version() {
            curl -fsS --max-time 30 https://www.pulumi.com/latest-version | tr -d '[:space:]' | sed 's/^v//'
          }
          tofu_version() {
            curl -fsS --max-time 30 https://get.opentofu.org/tofu/api.json \
              | jq -r '.versions[].id | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' | sort -V | tail -n 1
          }

          # A failed version request gives an empty version, which check refuses.
          pulumi_latest=$(pulumi_version) || pulumi_latest=
          tofu_latest=$(tofu_version) || tofu_latest=
          check pulumi "Pulumi CLI" "https://github.com/pulumi/pulumi/blob/vVERSION/CHANGELOG.md" "$pulumi_latest"
          check tofu "OpenTofu" "https://github.com/opentofu/opentofu/releases/tag/vVERSION" "$tofu_latest"

          # Fail at the end, so the failure shows after both tools were checked.
          exit "$failed"
