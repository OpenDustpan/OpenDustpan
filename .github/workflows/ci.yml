# Every change must pass the same gates locally (make check) and here.
# Actions are pinned to commit SHAs; the comment names the release.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Verify module checksums
        run: go mod verify
      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: "1.31.1"
      - name: Generated SQL code is up to date
        run: sqlc diff
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: Docs follow ASD-STE100 (ADR 14)
        run: make docs-lint
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/opendustpan

  # The gate for every endpoint (AGENTS.md): real Pulumi CLI and OpenTofu
  # binaries drive the server on SQLite and on PostgreSQL.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The pinned versions of the matrix are in e2e/tool.go, so the key changes
      # when they change. The "latest" versions are downloaded on each run.
      - name: Cache the CLI archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/opendustpan-e2e
          key: e2e-clis-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/tool.go') }}
      - name: End-to-end suite
        run: make e2e
      - name: Show the report
        if: ${{ !cancelled() }}
        run: |
          if [ -f e2e/report/summary.md ]; then
            cat e2e/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
