# Every change must pass the same gates locally (make check) and here.
# Actions are pinned to commit SHAs; the comment names the release.
name: ci

on:
  push:
    branches: [ main ]
    # A release tag also runs the release record guard in the lint job.
    tags: [ 'v*' ]
  pull_request:
    # Draft pull requests run no jobs: mark a PR ready to run CI on it.
    types: [ opened, synchronize, reopened, ready_for_review ]
  # Every 2 hours, the go and store jobs on main run each test package again
  # without the test cache (GO_TEST_COUNT=-count=1), to find flaky tests. The
  # lint job also runs, so that make vuln finds a new advisory. The e2e,
  # e2e-light and scan jobs do not run on the schedule. Each run uses about 9
  # runner-minutes, most of them on the paid Blacksmith runners.
  # GitHub sends the failure notification of a scheduled run to the user who
  # last changed this cron line.
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

# The project has four self-hosted runners. A new push to a pull request
# cancels the run for the older head of that pull request. Runs on main
# are never canceled. The draft state is part of the group, so a run for a
# draft (all jobs skipped) and a run for a ready pull request never cancel
# each other. A scheduled run has its own group, so it never replaces a
# pending push run for the same commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ github.event.pull_request.draft == true }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# For now, all jobs run on the runners in CI_RUNS_ON (see runs-on-large in
# the go job). The rest of this note is for the Blacksmith layout.
#
# The CPU-bound tests (go, store and e2e) run on paid 8 vCPU Blacksmith
# runners. They kept all the cores of a 4 vCPU runner busy, and on 8 vCPUs
# they took about half the time. The other jobs (lint, scan and e2e-light)
# run on the runners in the repository variable CI_RUNS_ON, as a JSON
# value: unset means GitHub-hosted "ubuntu-latest"; ["self-hosted","linux",
# "x64"] means the project's own machines. Never point a public
# repository's pull requests from forks at self-hosted runners.
#
# The project's machines (github-actions-runner1 to 4) keep the Go build
# cache, the Go module cache and the golangci-lint cache on their disks
# between jobs, and also the CLI archives of the e2e suite. Thus the jobs
# use the GitHub Actions cache only on other runners, where each job starts
# on an empty machine. The Blacksmith runners also say "self-hosted" in
# runner.environment, so the jobs check the runner name instead.

jobs:
  # The checks that need no database. They run apart from the tests, on
  # the runners in CI_RUNS_ON.
  lint:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # The scan and e2e-light jobs use this value through the YAML alias
    # *runs-on-own.
    runs-on: &runs-on-own ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !startsWith(runner.name, 'github-actions-runner') }}
      # A tag with an empty release record, or a record that does not name
      # the tag, would ship with the shipped-migration checks off.
      - name: The release record names the tag
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
        run: make release-record-check VERSION="$TAG"
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Verify module checksums
        run: go mod verify
      - name: Each module version is at least 14 days old
        run: |
          python3 -I scripts/module-age-gate.py --selftest
          python3 -I scripts/module-age-gate.py
      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: "1.31.1"
      - name: Generated SQL code is up to date
        run: sqlc diff
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          skip-cache: ${{ startsWith(runner.name, 'github-actions-runner') }}
      - name: No check reads a variable that a parallel subtest writes
        run: make subtestcheck
      # The journal recording build needs a second lint run, because some
      # files are left out of that build and one run cannot hold both. The
      # make target holds the build tag, so this file never names it and the
      # release guard (make journal-guard) stays clean. The install-only step
      # puts golangci-lint on the PATH. It does not restore the lint cache:
      # the step above already did that on an empty machine, and on one of the
      # project's machines the restore took 40 to 55 seconds to download and
      # unpack an old 145 MB copy over the cache on the disk.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
          skip-cache: true
      - name: Lint the journal recording build
        run: make lint-journal-build
      - name: Nil-panic analysis
        run: make nilaway
      - name: Known vulnerabilities
        run: make vuln
      # Put the pipx directory first on PATH: a self-hosted machine can have
      # another semgrep (for example a snap, which cannot read the workspace).
      # --force makes the pin apply on a machine that keeps an older install.
      # A machine that already has the pinned version skips the install,
      # which took 15 seconds on each run.
      - name: Install Semgrep
        env:
          SEMGREP_VERSION: 1.178.0
        run: |
          bin="${PIPX_BIN_DIR:-$HOME/.local/bin}"
          if [ "$("$bin/semgrep" --version --disable-version-check 2>/dev/null)" != "$SEMGREP_VERSION" ]; then
            pipx install --force "semgrep==$SEMGREP_VERSION"
          fi
          echo "$bin" >> "$GITHUB_PATH"
      - name: Semgrep rules
        run: make semgrep
      - name: Each linked module has a license file to ship
        run: make licenses
      - name: Docs follow ASD-STE100 (ADR 14)
        run: make docs-lint
      - name: The release record script refuses bad input
        run: make release-record-check

  go:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # The store and e2e jobs use this value through the YAML alias *runs-on-large.
    # For now it is CI_RUNS_ON, not blacksmith-8vcpu-ubuntu-2404, to stop
    # the paid minutes. The Blacksmith steps below skip on other runners.
    runs-on: &runs-on-large ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    services:
      postgres:
        # The Go test cache does not see the image. The digest makes sure that
        # the image changes only in a commit, not under cached test results. The
        # scheduled uncached run tests each new digest.
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        # A fixed port keeps DUSTPAN_TEST_POSTGRES_URL the same from job to job,
        # so go test can use cached results. Each machine runs one job at a time.
        ports: [ "5432:5432" ]
        # The image declares a volume at /var/lib/postgresql on the disk of the
        # runner. The job hooks of each self-hosted runner remove it. A
        # parallel query keeps its shared memory in /dev/shm, and the Docker
        # default of 64 MiB is too small for the tests.
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # On a Blacksmith runner, the temporary files of the tests (SQLite
      # databases, test binaries, the data directories of the e2e servers)
      # stay in memory. The 8 vCPU runner has 32 GB of memory and the jobs
      # used 1.1 GB at most, but its disk showed high IOPS during the tests.
      - &ramdisk
        name: Keep temporary files in memory
        if: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/ram
          sudo mount -t tmpfs -o size=16g,mode=1777 tmpfs /mnt/ram
          mkdir -p /mnt/ram/tmp
          echo "TMPDIR=/mnt/ram/tmp" >> "$GITHUB_ENV"
      # A Blacksmith sticky disk keeps the Go build cache, with the test
      # results, and the Go module cache from job to job, like the disk of a
      # project machine. The setup-go cache cannot do this: it saves only
      # when no cache for the go.sum exists, so the test results in it get
      # old. Each job (and each store) has its own disks, so jobs that run at
      # the same time do not overwrite the snapshot of another job. Only runs
      # on main save the disks. A pull request reads them and saves nothing,
      # so that no pull request can put a bad result into the cache of main.
      # The disks mount at the default GOCACHE and GOMODCACHE paths. The key
      # holds the job and its index in the matrix (0 for a job without a
      # matrix), so a change of the store order gives the stores new disks.
      - &sticky-go-build
        name: Mount the Go build cache
        if: ${{ startsWith(runner.name, 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-go-build-${{ github.job }}-${{ strategy.job-index }}
          path: ~/.cache/go-build
          commit: ${{ github.event_name == 'pull_request' && 'false' || 'on-change' }}
      - &sticky-go-mod
        name: Mount the Go module cache
        if: ${{ startsWith(runner.name, 'blacksmith-') }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-go-mod-${{ github.job }}-${{ strategy.job-index }}
          path: ~/go/pkg/mod
          commit: ${{ github.event_name == 'pull_request' && 'false' || 'on-change' }}
      - &setup-go-sticky
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Pushes and pull requests use the test cache. The schedule runs every
      # package again (GO_TEST_COUNT=-count=1). The two store packages run in
      # the store job.
      - name: Test
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: make test-ci-other ${{ github.event_name == 'schedule' && 'GO_TEST_COUNT=-count=1' || '' }}
      - name: Build
        run: go build ./cmd/opendustpan

  # The SQLite and PostgreSQL store packages are the two longest test
  # packages, and both are CPU-bound. Each one runs in a job of its own, so
  # that it does not share the cores of a runner with the other or with the
  # rest of go test.
  store:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: *runs-on-large
    strategy:
      fail-fast: false
      matrix:
        store: [ sqlite, postgres ]
    services:
      postgres:
        # The same image as the go job. An empty image starts no service, so
        # the sqlite job has no PostgreSQL.
        image: ${{ matrix.store == 'postgres' && 'postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *ramdisk
      - *sticky-go-build
      - *sticky-go-mod
      - *setup-go-sticky
      # The runner throws the service container away after the job, so its
      # data needs no durability. On a runner, each checkpoint of a store test
      # run spent 55 to 90 seconds in fsync of about 120,000 files. These
      # settings change only what PostgreSQL keeps after a crash of the
      # machine, not what a query returns. The e2e-light job, which has the
      # crash test, keeps the defaults.
      - name: Turn off fsync in the test PostgreSQL
        if: ${{ matrix.store == 'postgres' }}
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -q \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
      # The runner throws the service container away after the job, so the
      # PostgreSQL tests keep their database at the end
      # (DUSTPAN_TEST_SKIP_FINAL_DROP). A local run drops it.
      - name: Test
        env:
          DUSTPAN_TEST_POSTGRES_URL: ${{ matrix.store == 'postgres' && format('postgres://postgres:postgres@localhost:{0}/postgres?sslmode=disable', job.services.postgres.ports['5432']) || '' }}
          DUSTPAN_TEST_SKIP_FINAL_DROP: ${{ matrix.store == 'postgres' && '1' || '' }}
        run: make test-ci-store STORE=${{ matrix.store }} ${{ github.event_name == 'schedule' && 'GO_TEST_COUNT=-count=1' || '' }}

  # Trivy and TruffleHog (make trivy, make trufflehog). The binaries come from
  # the upstream releases, and each archive is checked against the SHA-256
  # pinned here. Change a version together with its checksum and the Makefile.
  scan:
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: *runs-on-own
    env:
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      TRUFFLEHOG_VERSION: 3.99.2
      TRUFFLEHOG_SHA256: 3c7b0d1dc4278294269bfdd7594bca8bb28c78da0a4a06ad202ded37b48deca4
    steps:
      # TruffleHog scans the Git history, so fetch all of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The Trivy license scan reads the Go module cache (make trivy).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !startsWith(runner.name, 'github-actions-runner') }}
      - name: Install Trivy and TruffleHog
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scan" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/scan"
          curl -fsSL --retry 3 -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o trufflehog.tar.gz \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          echo "${TRUFFLEHOG_SHA256}  trufflehog.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C "$HOME/.local/bin" trivy
          tar -xzf trufflehog.tar.gz -C "$HOME/.local/bin" trufflehog
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Trivy scan
        run: make trivy
      - name: TruffleHog scan
        run: make trufflehog

  # The gate for every endpoint (AGENTS.md): real Pulumi CLI and OpenTofu
  # binaries drive the server on SQLite and on PostgreSQL.
  e2e:
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: *runs-on-large
    timeout-minutes: 70
    services:
      postgres:
        # The Go test cache does not see the image. The digest makes sure that
        # the image changes only in a commit, not under cached test results. The
        # scheduled uncached run tests each new digest.
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        # A fixed port keeps DUSTPAN_TEST_POSTGRES_URL the same from job to job,
        # so go test can use cached results. Each machine runs one job at a time.
        ports: [ "5432:5432" ]
        # The image declares a volume at /var/lib/postgresql on the disk of the
        # runner. The job hooks of each self-hosted runner remove it. A
        # parallel query keeps its shared memory in /dev/shm, and the Docker
        # default of 64 MiB is too small for the tests.
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *ramdisk
      - *sticky-go-build
      - *sticky-go-mod
      - *setup-go-sticky
      # The pinned versions of the matrix are in e2e/tool.go, so the key changes
      # when they change. The "latest" versions are downloaded on each run.
      - &cache-clis
        name: Cache the CLI archives
        if: ${{ !startsWith(runner.name, 'github-actions-runner') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/opendustpan-e2e
          key: e2e-clis-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/tool.go') }}
      - name: End-to-end suite
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: make e2e
      - &show-report
        name: Show the report
        if: ${{ !cancelled() }}
        run: |
          if [ -f e2e/report/summary.md ]; then
            cat e2e/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # The shorter tests that drive the server binary: the journal route, an
  # upgrade, a crash and network faults. Each one uses little CPU, so they
  # run apart from the e2e suite, on the runners in CI_RUNS_ON.
  e2e-light:
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: *runs-on-own
    timeout-minutes: 70
    services:
      postgres:
        # The same image as the e2e job.
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        # Each machine runs one job at a time, so a fixed port is free.
        ports: [ "5432:5432" ]
        # The image declares a volume at /var/lib/postgresql on the disk of the
        # runner. The runner does not remove that volume after the job. The job
        # hooks of each self-hosted runner remove it. A parallel query keeps its
        # shared memory in /dev/shm, and the Docker default of 64 MiB is too
        # small for the tests.
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # The network fault tests (make faults) drive this Toxiproxy server.
      # Toxiproxy is a test-only tool and never ships.
      toxiproxy:
        # The digest makes sure that the image changes only in a commit, like
        # the PostgreSQL image.
        image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
        # 8474 is the API. The tests give each proxy a fixed port from
        # TOXIPROXY_PORT_BASE (8475) to TOXIPROXY_PORT_BASE + 3, and the
        # client dials each proxy on the same port of the runner.
        ports: [ "8474:8474", "8475-8478:8475-8478" ]
        # The proxies dial the test server and PostgreSQL on the runner
        # through this name.
        options: >-
          --add-host=host.docker.internal:host-gateway
    steps:
      # The upgrade test reads the v* tags, so fetch all of the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !startsWith(runner.name, 'github-actions-runner') }}
      - *cache-clis
      - name: Journal end-to-end tests
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: make e2e-journal
      # ADR 33, decision 7. Without a v* tag, only the empty-database case runs.
      - name: Upgrade test
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: make upgrade-test
      - name: Crash test
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: make crash-test
      - name: Network fault tests
        env:
          DUSTPAN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
          TOXIPROXY_URL: http://localhost:${{ job.services.toxiproxy.ports['8474'] }}
          TOXIPROXY_LISTEN_HOST: 0.0.0.0
          TOXIPROXY_PORT_BASE: "8475"
          TOXIPROXY_UPSTREAM_HOST: host.docker.internal
        run: make faults
      - *show-report
