name: Cancel CI of a closed pull request

# When a pull request closes (merged or not), this run joins the concurrency
# group of its CI run, and GitHub cancels the CI run that is in progress.
on:
  pull_request:
    types: [ closed ]

permissions: {}

concurrency:
  # Keep this equal to the group in ci.yml for a pull request. A merge group
  # has its own group in ci.yml, so this run never cancels a run of the merge
  # queue.
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cancel:
    # This job never runs: the run only has to join the group. The workflow
    # starts only for a closed pull request, so this condition is always false.
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    steps:
      - run: "true"
