name: Cancel CI of a closed pull request

# When a pull request closes (merged or not), this run joins the concurrency
# group of its CI run, and GitHub cancels the CI run that is in progress.
on:
  pull_request:
    types: [ closed ]

concurrency:
  # Keep this equal to the group in ci.yml for a pull request that is not a draft.
  group: ci-${{ github.event.pull_request.number }}-false
  cancel-in-progress: true

jobs:
  cancel:
    # This job never runs: the run only has to join the group.
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"
