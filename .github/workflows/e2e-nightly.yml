# The end-to-end suite with the real server binary (E2E_SERVER=binary) on
# SQLite, once each night on main. The ci.yml e2e job runs the suite with the
# in-process server. This run shows that the shipped binary works with each
# CLI. It is slower, so pull requests do not run it.
# GitHub sends the failure notification of a scheduled run to the user who
# last changed the cron line.
name: e2e-nightly

on:
  # A minute that is not 0, so that the load at the start of the hour does not
  # delay the run.
  schedule:
    - cron: "43 2 * * *"
  # A maintainer can start a run by hand, for example to check a fix.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-binary:
    # A scheduled run uses the default branch. A run by hand must use it too.
    if: ${{ github.ref == 'refs/heads/main' }}
    # The same value as the jobs of ci.yml.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The pinned versions of the matrix are in e2e/tool.go, so the key changes
      # when they change. The "latest" versions are downloaded on each run.
      - name: Cache the CLI archives
        if: ${{ !startsWith(runner.name, 'github-actions-runner') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/opendustpan-e2e
          key: e2e-clis-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/tool.go') }}
      - name: End-to-end suite with the server binary
        env:
          E2E_SERVER: binary
          E2E_DATABASES: sqlite
        run: make e2e
      - name: Show the report
        if: ${{ !cancelled() }}
        run: |
          if [ -f e2e/report/summary.md ]; then
            cat e2e/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
