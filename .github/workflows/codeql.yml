# CodeQL static analysis of the Go code and of the GitHub Actions workflows.
# The results go to code scanning
# (Security > Code scanning). Actions are pinned to commit SHAs; the comment
# names the release.
name: codeql

on:
  push:
    branches: [ main ]
  pull_request:
  # Each week on Monday, so that a new CodeQL query also examines code that
  # did not change.
  schedule:
    - cron: "23 4 * * 1"

permissions: {}

# A new push to a pull request cancels the analysis of the older head. Runs of
# main and scheduled runs are never canceled.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      # The analyze step uploads the SARIF results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # In the manual mode, CodeQL examines each package that the build
          # step compiles, with the Go toolchain that setup-go installed from
          # go.mod.
          - language: go
            build-mode: manual
          # The workflows need no build.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build
        if: matrix.language == 'go'
        run: go build ./...
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
