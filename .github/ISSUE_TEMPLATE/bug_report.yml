name: Bug report
description: Something in the server does not work as the documentation says.
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for a security problem. Use the private
        vulnerability reporting route in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Say what you did, what you expected and what you got. Give the exact error text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the commands or requests, in order, that show the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Server version or commit
      description: The output of `opendustpan version`, or the commit hash.
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool and tool version
      description: For example the Pulumi CLI or OpenTofu, with its version. Leave empty if no tool is involved.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The operating system, the database (SQLite or PostgreSQL) and the blob store. Remove all secrets from logs before you paste them.
  - type: checkboxes
    id: ai
    attributes:
      label: Use of AI tools
      description: CONTRIBUTING.md says that you must tell us if an AI tool wrote part of this report.
      options:
        - label: A human reviewed and edited this report. If an AI tool helped, I name it in the text above.
          required: true
