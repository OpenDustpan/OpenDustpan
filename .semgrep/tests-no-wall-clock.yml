rules:
  - id: tests-no-wall-clock
    languages: [go]
    severity: ERROR
    message: >-
      Do not use the wall clock in a test: inject the clock (a func() time.Time or the clock port of the domain, for example blob.DatabaseClock or job.PhaseClock). A wall-clock test flakes under load.
    pattern-either:
      - pattern: time.Sleep(...)
      - pattern: time.Now()
      - pattern: time.Since(...)
      - pattern: time.After(...)
    paths:
      include:
        - "*_test.go"
      exclude:
        # existing; shrink only
        - cmd/dustpan-launcher/harden_linux_test.go
        - cmd/opendustpan/dev_test.go
