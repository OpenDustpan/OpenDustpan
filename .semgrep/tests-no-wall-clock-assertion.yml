rules:
  - id: tests-no-wall-clock-assertion
    languages: [go]
    severity: ERROR
    message: >-
      Do not assert a time bound on the wall clock in a test. A loaded CI
      runner makes the bound fail, and one failure drops every pull request in
      the merge group. Inject the clock (a func() time.Time or the clock port
      of the domain) and assert on the injected time, or wait for the event
      itself. A benchmark or a step against a real network can go on the
      exemption list of this rule, with the function name and the reason.
    # The rule matches an if statement that fails the test and whose
    # condition reads the wall clock: time.Since, time.Until,
    # time.Now().After, time.Now().Before, or a duration that time.Since or
    # time.Now().Sub measured before the if. A check of a timestamp against
    # time.Now().Add(...) is not a time bound on the test, so it passes.
    patterns:
      - pattern-either:
          - pattern: |
              if <... time.Since(...) ...> {
                ...
                $T.$FAIL(...)
                ...
              }
          - pattern: |
              if $INIT; <... time.Since(...) ...> {
                ...
                $T.$FAIL(...)
                ...
              }
          - pattern: |
              if $ELAPSED := time.Since(...); <... $ELAPSED ...> {
                ...
                $T.$FAIL(...)
                ...
              }
          - pattern: |
              if <... time.Until(...) ...> {
                ...
                $T.$FAIL(...)
                ...
              }
          - pattern: |
              if <... time.Now().After(...) ...> {
                ...
                $T.$FAIL(...)
                ...
              }
          - pattern: |
              if <... time.Now().Before(...) ...> {
                ...
                $T.$FAIL(...)
                ...
              }
          - pattern: |
              if $INIT; <... time.Now().After(...) ...> {
                ...
                $T.$FAIL(...)
                ...
              }
          - pattern: |
              if $INIT; <... time.Now().Before(...) ...> {
                ...
                $T.$FAIL(...)
                ...
              }
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $ELAPSED := time.Since(...)
                      ...
                  - pattern-inside: |
                      $ELAPSED = time.Since(...)
                      ...
                  - pattern-inside: |
                      $ELAPSED := time.Now().Sub(...)
                      ...
                  - pattern-inside: |
                      $ELAPSED = time.Now().Sub(...)
                      ...
              - pattern: |
                  if <... $ELAPSED ...> {
                    ...
                    $T.$FAIL(...)
                    ...
                  }
      - metavariable-regex:
          metavariable: $FAIL
          regex: ^(Fatal|Fatalf|Error|Errorf|Fail|FailNow)$
      # $T is the *testing.T, *testing.B or testing.TB of the test, not a
      # package such as fmt.
      - metavariable-regex:
          metavariable: $T
          regex: ^(?!(fmt|errors|log|slog)$)
      # Exemptions. Each entry names the function that holds the assertion
      # and the reason. Remove the entry when a fix lands. Add an entry only
      # for a benchmark or a step against a real network, or for an offender
      # that the sweep lists and that is not fixed yet.
      #
      # The ranks come from the sweep: how often the package of the test ran
      # in merge groups, and how close the bound is to the time on a loaded
      # runner. An entry matches each function of that name in any test file,
      # so a name that more than one file defines names its files here.
      # Rank 1. TestBackupTakeoverAfterGracefulStop in
      # internal/servertest/backup_test.go: upper bound 5s on the claim after
      # the stop signal. The lease is 30s, so only the release at the stop
      # explains a claim within the bound. Kept on purpose.
      - pattern-not-inside: |
          func TestBackupTakeoverAfterGracefulStop(...) { ... }
      # Rank 2. checkPlanPage in
      # pkg/store/postgres/namespace_page_internal_test.go: upper bound 250ms on
      # one page query. Not fixed yet.
      - pattern-not-inside: |
          func checkPlanPage(...) { ... }
      # Rank 3. TestPasskeyFailureGateBudget in
      # pkg/dustpan/passkey_gate_internal_test.go: upper bound 1s on one
      # refusal. The package runs about 400s under -race. Not fixed yet.
      - pattern-not-inside: |
          func TestPasskeyFailureGateBudget(...) { ... }
      # Rank 4. TestBuildJournalCheckpointTimesOut in
      # pkg/stack/journal_bounds_test.go: upper bound 1s on one refused build.
      #. Not fixed yet.
      - pattern-not-inside: |
          func TestBuildJournalCheckpointTimesOut(...) { ... }
      # Rank 5. checkSwapDoesNotQueueReads in
      # pkg/store/postgres/snapshot_swap_internal_test.go: upper bound readBound
      # = 500ms. Not fixed yet.
      - pattern-not-inside: |
          func checkSwapDoesNotQueueReads(...) { ... }
      # Rank 6. writeStacksPastThreshold in pkg/store/sqlite/wal_test.go: upper
      # bound 2s. Not fixed yet.
      - pattern-not-inside: |
          func writeStacksPastThreshold(...) { ... }
      # Rank 7. TestReleaseOfStalledLongConnFreesTheSlot in
      # pkg/store/postgres/long_path_internal_test.go: upper bound
      # resetTimeout+1s = 3s. Not fixed yet.
      - pattern-not-inside: |
          func TestReleaseOfStalledLongConnFreesTheSlot(...) { ... }
      # Rank 8. TestStatementDeadlineClosesStalledConnection in
      # pkg/store/postgres/failover_internal_test.go: upper bound deadlineBound
