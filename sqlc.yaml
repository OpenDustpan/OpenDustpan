# sqlc generates typed Go for the fixed queries of each store adapter.
# It does not translate between dialects: each engine has its own schema and
# queries. Dynamic queries (optional filters, sorting) are hand-written.
version: "2"
sql:
  - engine: sqlite
    schema: pkg/store/sqlite/migrations
    queries: pkg/store/sqlite/queries.sql
    gen:
      go:
        package: db
        out: pkg/store/sqlite/internal/db
        emit_exported_queries: false
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
        # STRICT tables have no boolean type; flags are INTEGER 0 or 1.
        overrides:
          - column: updates.dry_run
            go_type: bool
          - column: checkpoints.invalid
            go_type: bool
          - column: state_versions.force
            go_type: bool
          - column: state_versions.sealed
            go_type: bool
          - column: namespaces.allow_forced_writes
            go_type: bool
          - column: namespaces.allow_unlocked_writes
            go_type: bool
          - column: workspaces.allow_forced_writes
            go_type: bool
          - column: workspaces.allow_unlocked_writes
            go_type: bool
          - column: state_versions.unlocked_write
            go_type: bool
          - column: principals.disabled
            go_type: bool
  - engine: postgresql
    schema: pkg/store/postgres/migrations
    queries: pkg/store/postgres/queries.sql
    gen:
      go:
        package: db
        out: pkg/store/postgres/internal/db
        sql_package: pgx/v5
        emit_exported_queries: false
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
