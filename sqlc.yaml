# sqlc generates typed Go for the fixed queries of each store adapter.
# It does not translate between dialects: each engine has its own schema and
# queries. Dynamic queries (optional filters, sorting) are hand-written.
version: "2"
sql:
  - engine: sqlite
    schema: store/sqlite/migrations
    queries: store/sqlite/queries.sql
    gen:
      go:
        package: db
        out: store/sqlite/internal/db
        emit_exported_queries: false
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
  - engine: postgresql
    schema: store/postgres/migrations
    queries: store/postgres/queries.sql
    gen:
      go:
        package: db
        out: store/postgres/internal/db
        sql_package: pgx/v5
        emit_exported_queries: false
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
